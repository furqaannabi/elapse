# Elapse indexer — Envio HyperIndex V3 (indexer FRD, FR-IDX-001..004).
# One chain per deployment: Monad testnet 10143 now; mainnet 143 is added in Week 5
# with start_block from contracts/deployments/143.json.
name: elapse
description: Elapse per-second billing streams on Monad

# Every address the indexer surfaces is lowercase, so entity ids and ingest bodies
# match the platform's lowercase columns without per-handler calls (FR-IDX-022).
address_format: lowercase

# Decided 2026-09-05 (Undecided 2, option b): no rollback. MonadBFT finality makes a
# post-ingest reorg a chain failure; block_hash travels with every ingest for audit.
rollback_on_reorg: false

# number, timestamp and hash are on every event by default; the tx hash is opt-in.
field_selection:
  transaction_fields:
    - hash

contracts:
  - name: StreamFactory
    abi_file_path: ./abis/StreamFactory.json
    events:
      - event: StreamCreated
      - event: FeeChanged
  - name: AccrualStream
    abi_file_path: ./abis/AccrualStream.json
    events:
      - event: Deposited
      - event: StreamStarted
      - event: StreamPaused
      - event: StreamResumed
      - event: Settled
      - event: StreamCanceled

chains:
  - id: 10143 # Monad testnet
    start_block: 59873725 # contracts/deployments/10143.json deployedAtBlock
    contracts:
      - name: StreamFactory
        address: "0x2A27160FC556819f2b3D293bbFA0aac5360E3C40"
      - name: AccrualStream # registered dynamically from StreamCreated (FR-IDX-002)
