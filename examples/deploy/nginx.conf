# examples.elapse.finance — both example merchants on one host, under path prefixes.
# FR-EXM-037, ADR 2026-09-26 (docs/decisions/2026-09-26-examples-on-one-subdomain.md).
#
# Each example is a plain Node server on 127.0.0.1 (examples/deploy/*.service). nginx strips the
# prefix, so the servers keep their own root routes; their pages use relative URLs (FR-EXM-036/159),
# which is why a page must be reached with its trailing slash.
#
# On the host, once, after DNS for examples.elapse.finance points here:
#   sudo mkdir -p /var/www/examples && sudo cp examples/deploy/site/index.html /var/www/examples/
#   sudo cp examples/deploy/nginx.conf /etc/nginx/sites-available/examples.elapse.finance
#   sudo ln -s /etc/nginx/sites-available/examples.elapse.finance /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d examples.elapse.finance      # turns this into 443 ssl plus a redirect

server {
  listen 80;
  server_name examples.elapse.finance;

  # The page that links both examples.
  root /var/www/examples;
  location = / { try_files /index.html =404; }

  # A relative Location, so the redirect never depends on which host or port nginx believes it is on.
  absolute_redirect off;
  location = /saas   { return 301 /saas/; }
  location = /lambda { return 301 /lambda/; }

  location /saas/ {
    proxy_pass http://127.0.0.1:3007/;          # the trailing slash is what strips /saas/
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /lambda/ {
    proxy_pass http://127.0.0.1:3006/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A first Run can wait up to 30 s for the meter to start and then run the 30 s default
    # snippet, which is past nginx's 60 s default: the subscriber would be billed for a run
    # that answered 504.
    proxy_read_timeout 120s;
  }
}
