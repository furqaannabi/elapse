<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23262a">
<title>Console · {{merchant}}</title>
<link rel="stylesheet" href="/northwind.css">
<!-- The console's own bundle: React, @elapse/react and its styles (npm run build:web, FR-EXM-152). -->
<link rel="stylesheet" href="/web.css">
<!-- Monaco stays on its pinned CDN; the console falls back to a textarea if it is unreachable. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js" crossorigin></script>
</head>
<body>
<main class="term">
  <header class="id">
    <a class="mark" href="/">North<b>wind</b></a>
    <span class="loc">Field terminal<br>Unit 07</span>
  </header>

  <!-- FR-EXM-152: authorised and metered in place with @elapse/react. The publishable key belongs
       in the page; the secret key never leaves the server (BR-RCT-002). -->
  <div id="root"
       data-publishable-key="{{publishable_key}}"
       data-api-url="{{api_url}}"
       data-app-url="{{app_url}}"
       data-merchant="{{merchant}}"></div>
  <script type="module" src="/web.js"></script>

  <p class="note">You pay for the seconds your code runs. The meter is paused between runs, and when the session closes you are shown the exact amount settled.</p>

  <footer class="tag">{{merchant}} · demo merchant</footer>
</main>
</body>
</html>
